name: Build unsigned IPA

on:
  # Manual trigger: Actions tab -> "Build unsigned IPA" -> Run workflow
  workflow_dispatch:
  # Automatic build when iOS app sources change on main
  push:
    branches: [main]
    paths:
      - "NexusIOS/**"
      - ".github/workflows/ipa.yml"

jobs:
  build-ipa:
    # Pinned image: macos-latest floats (was macos-13 -> 15 -> 26 drift risk).
    # Any Xcode >= 16 builds this project (pbxproj objectVersion 77, Swift 5, iOS 16 target).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project NexusIOS/NexusIOS.xcodeproj \
            -scheme NexusIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/unsigned.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild.log

      # Raw log even when the build fails, so errors are readable without gh access.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: error

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/unsigned.xcarchive/Products/Applications/NexusIOS.app" build/Payload/
          cd build
          zip -qry NexusIOS-unsigned.ipa Payload
          cd ..

      - name: Compile UI tests for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project NexusIOS/NexusIOS.xcodeproj \
            -scheme NexusIOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/xcodebuild-uitests.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusIOS-unsigned-ipa
          path: build/NexusIOS-unsigned.ipa
          if-no-files-found: error
