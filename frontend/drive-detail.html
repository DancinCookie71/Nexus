<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Detail | Nexus Panel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-content">
            <header class="topbar">
                <div class="brand">
                    <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">☰</button>
                    <h1 class="page-title">Drive Detail</h1>
                </div>
                <div class="user-menu">
                    <span id="current-user">...</span>
                </div>
            </header>
            <main class="page-body">
                <div class="page-header">
                    <div class="drive-title">
                        <h1 id="drive-device">Loading...</h1>
                        <span id="drive-status-badge"></span>
                    </div>
                    <p class="detail" id="drive-model"></p>
                </div>

                <div class="card">
                    <div class="toolbar">
                        <h2 style="margin:0;">SMART Information</h2>
                        <button class="btn btn-ghost btn-sm" id="refresh-drive">Refresh</button>
                    </div>
                    <div id="drive-loading">Examining drive...</div>
                    <div id="drive-content" style="display:none;">
                        <div class="detail-grid" id="drive-info-grid"></div>

                        <h3 style="margin-top:1.5rem;">SMART Attributes</h3>
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Attribute</th>
                                        <th>Value</th>
                                        <th>Worst</th>
                                        <th>Threshold</th>
                                        <th>Type</th>
                                        <th>Status</th>
                                        <th>Raw</th>
                                    </tr>
                                </thead>
                                <tbody id="drive-attributes-body"></tbody>
                            </table>
                        </div>
                        <div id="drive-messages" style="margin-top:1rem;"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/drive-detail.js"></script>
</body>
</html>
