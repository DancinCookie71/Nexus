<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus Panel</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand">
            <div class="logo" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
                    <defs>
                        <linearGradient id="nl" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#4f46e5"/>
                        </linearGradient>
                    </defs>
                    <rect width="64" height="64" rx="14" fill="url(#nl)"/>
                    <path fill="#fff" d="M17 47V17h7.5l15 20.5V17H47v30h-7.5L24.5 26.5V47Z"/>
                </svg>
            </div>
            <h1>Nexus Panel</h1>
            <p>Sign in to manage your server.</p>
        </div>
        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-button">Sign In</button>
            <p class="error-message" id="error-message" role="alert" aria-live="polite"></p>
        </form>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
